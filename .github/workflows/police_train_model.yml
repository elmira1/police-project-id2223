# .github/workflows/police-train-model.yml
name: police-train-model

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0" # Sunday 05:00 UTC (weekly)

concurrency:
  group: police-train-model
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature + training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: id2223_lab1_G22
        run: |
          python src/1_daily_feature_pipeline.py
          python src/2_training_pipeline.py
