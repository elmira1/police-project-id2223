# .github/workflows/police-daily-update.yml
name: police-daily-update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day

concurrency:
  group: police-daily-update
  cancel-in-progress: true

jobs:
  schedule_pipelines:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipelines (features + inference)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: id2223_lab1_G22
        run: |
          python src/1_daily_feature_pipeline.py
          python src/3_inference_pipeline.py

      - name: Commit updated outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily update: forecasts + monitoring"
          file_pattern: |
            crime_forecast.png
            predicted_type_distribution.png
            monitor_confusion_matrix.png
            monitor_recent.csv
            src/city_coords.json
