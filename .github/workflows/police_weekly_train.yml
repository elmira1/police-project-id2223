name: run_weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: write

concurrency:
  group: police-pipelines
  cancel-in-progress: true

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import hopsworks, sklearn; print('hopsworks=', hopsworks.__version__); print('sklearn=', sklearn.__version__)"

      - name: Sync with remote main (avoid non-fast-forward)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          
      - name: Run pipelines (weekly)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: id2223_lab1_G22
        run: |
          python src/1_daily_feature_pipeline.py
          python src/2_training_pipeline.py
          python src/3_inference_pipeline.py

      - name: Commit dashboard artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly training + dashboard update"
          file_pattern: |
            crime_forecast.png
            predicted_type_distribution.png
            monitor_confusion_matrix.png
            monitor_recent.csv
            src/city_coords.json
            src/weather_cache.json
