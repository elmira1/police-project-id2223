name: police-weekly-train

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0" # Sunday 05:00 UTC

jobs:
  run_weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y hopsworks hsfs hsml hopsworks-common || true
          pip install -r requirements.txt
          python -c "import hopsworks, sklearn; print('hopsworks=', hopsworks.__version__); print('sklearn=', sklearn.__version__)"

      - name: Run pipelines (weekly train)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: id2223_lab1_G22
        run: |
          python src/1_daily_feature_pipeline.py
          python src/2_training_pipeline.py
          python src/3_inference_pipeline.py

      - name: Commit dashboard artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly training + dashboard update"
          file_pattern: |
            crime_forecast.png
            predicted_type_distribution.png
            monitor_confusion_matrix.png
            monitor_recent.csv
            src/city_coords.json
          push_options: "--force"
