[project]
name = "police-project-id2223"
version = "1"
requires-python = "==3.10.9"

dependencies = [
    # Hopsworks client (pin to backend minor version 4.2.*)
    "hopsworks[python]==4.2.*",

    # Data / ML
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn<1.4",
    "joblib>=1.3,<2",

    # Plotting
    "matplotlib>=3.7,<4",

    # HTTP + geo
    "requests>=2.31,<3",
    "geopy>=2.4,<3",

    # Optional: Streamlit
    "streamlit>=1.30,<2",

    # XGBoost
    "xgboost==2.0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
